# ashare-quant: 数据 pipeline 定时刷新 → GitHub Pages 报告页（国内数据源 akshare 优先）
name: Data Pipeline (Daily A-Share)
on:
  schedule:
    - cron: '30 15 * * 1-5'   # 北京时间交易日收盘后
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install (akshare 国内数据源优先)
        run: pip install -r requirements.txt
      - name: Refresh data + generate report (akshare 拉不到自动回退占位)
        run: python refresh_report.py
      - name: Commit report
        run: |
          git config user.name "ashare-bot"; git config user.email "bot@example.com"
          git add reports/ && (git commit -m "chore(ashare-quant): 每日报告 $(date +%F)" || echo "no change")
          git push

  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish reports
        run: |
          mkdir -p .github && echo 'ashare-quant' > .github/URL
      - uses: actions/deploy-pages@v4
        with:
          page: web
