# ashare-quant: 数据 pipeline 定时刷新 → GitHub Pages 报告页（国内数据源 akshare 优先）
name: Data Pipeline (Daily A-Share)
on:
  schedule:
    - cron: '30 15 * * 1-5'   # 北京时间交易日收盘后
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install (akshare 国内数据源优先，拉不到自动回退占位)
        run: pip install -r requirements.txt || pip install pandas numpy
      - name: Refresh data + generate report
        run: python refresh_report.py
      - name: Push reports to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          # 切到 gh-pages，把 main 刚生成的 reports 推过去（保留 gh-pages 上已有 index.html 兜底）
          git checkout -B gh-pages origin/gh-pages 2>/dev/null || git checkout -B gh-pages
          git checkout main -- reports 2>/dev/null || true
          git add -A
          git commit -m "pages: auto-update report ($(date +%Y-%m-%d))" --allow-empty
          git push origin gh-pages
        continue-on-error: false
