# ashare-quant: 数据 pipeline 定时刷新 → GitHub Pages 报告页（国内数据源 akshare 优先）
name: Data Pipeline (Daily A-Share)
on:
  schedule:
    - cron: '30 15 * * 1-5'   # 北京时间交易日收盘后
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install (akshare 国内数据源优先)
        run: pip install -r requirements.txt
      - name: Refresh data + generate report (akshare 拉不到自动回退占位)
        run: python refresh_report.py
      - name: Deploy to GitHub Pages
        run: |
          mkdir -p .github && echo 'ashare-quant' > .github/URL
      - name: Publish reports to Pages
        uses: actions/deploy-pages@v4
        with:
          page: web

